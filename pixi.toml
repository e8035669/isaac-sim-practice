[workspace]
authors = ["Jeff Zhang <e8035669@gmail.com>"]
channels = ["conda-forge", "robostack-jazzy"]
name = "isaac-sim-proj2"
platforms = [{ name = "linux-64-glibc-2-35", platform = "linux-64", glibc = "2.35" }]
version = "0.1.0"

[tasks]
isaac-streaming = "isaacsim isaacsim.exp.full.streaming --no-window --/exts/omni.kit.livestream.app/primaryStream/targetFps=30 --/app/window/dpiScaleOverride=2.0"
# 同isaac-streaming, 但開啟StreamSDK的log, 可在kit log中看到codec協商過程
isaac-streaming-debug = "isaacsim isaacsim.exp.full.streaming --no-window --/exts/omni.kit.livestream.app/primaryStream/targetFps=30 --/log/channels/omni.kit.livestream.streamsdk=verbose --/app/window/dpiScaleOverride=2.0"

[dependencies]
python = "3.12.*"
ros-jazzy-ur-description = ">=3.5.1,<4"
ros-jazzy-turtlesim = ">=1.8.4,<2"
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-xacro = ">=2.1.1,<3"

# 以下套件為了配合isaacsim解析而釘選
setuptools = "<82"
psutil = "==5.9.8"
aiohttp = "==3.14.3"
multidict = "==6.1.0"
wrapt = "==1.16.0"
aiohappyeyeballs = "==2.6.1"
attrs = "==25.1.0"
frozenlist = "==1.5.0"
propcache = "==0.2.1"
yarl = "==1.18.3"
idna = "==3.10"
numpy = "==2.3.1"
cryptography = "==50.0.1"
packaging = "==26.0"
kiwisolver = "==1.4.9"
pyparsing = "==3.3.2"
fonttools = "==4.61.1"
contourpy = "==1.3.3"
matplotlib = "==3.10.8"

[activation]
scripts = ["scripts/stage-libxml2-legacy.sh"]

[activation.env]
RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"
__NV_PRIME_RENDER_OFFLOAD = "1"
__GLX_VENDOR_LIBRARY_NAME = "nvidia"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib/python3.12/site-packages/isaacsim/exts/isaacsim.ros2.core/jazzy/lib:$PIXI_PROJECT_ROOT/.pixi/xml2-legacy-libs:$LD_LIBRARY_PATH"
QT_QPA_PLATFORM = "xcb"

# 升級isaacsim時, 確認是否還需要舊版本libxml2的workaround, 詳見stage-libxml2-legacy.sh
[feature.xml2-legacy.dependencies]
libxml2 = "2.13.*"

[environments]
xml2-legacy = { features = ["xml2-legacy"], no-default-feature = true }

[pypi-options]
prerelease-mode = "allow"

# 升級isaacsim時, 不要使用isaacsim指定的版本, 而是以ros要的版本為主,
# 因為ros可能有C語言API的相依性, 而isaac只會有python api的相依性
[pypi-options.dependency-overrides]
opencv-python-headless-noffmpeg = ">=4.14"

# 升級isaacsim時, 重新確認isaacsim是否還是綁定noffmpeg這個nvidia自己編譯的版本, 並不要使用isaacsim指定的版本, 而是ros要的版本
[workspace.conda-pypi-map]
conda-forge = { mapping = { py-opencv = ["opencv-python", "opencv-python-headless", "opencv-python-headless-noffmpeg"] } }

[pypi-dependencies]
isaacsim = { version = "==6.2.0.0", extras = ["all", "extscache"], index = "https://pypi.nvidia.com" }
# 升級isaacsim時, 重新確認isaacsim使用的pytorch是否有升級
# https://docs.isaacsim.omniverse.nvidia.com/latest/installation/install_python.html 
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu128" }
